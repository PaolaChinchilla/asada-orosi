<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#16181c">

    <meta name="description" content="Detalle del registro de daño o accidente de vehículos de ASADA Orosi.">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/seguridad.css?v=20260924-7">

    <link rel="stylesheet" href="css/style.css?v=20260924-7">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <title>
        Detalle de daño o accidente | ASADA Orosi
    </title>


    <style>
        /* =====================================================
           ESTADO
           ===================================================== */

        .accident-status-badge {

            display: inline-flex;

            align-items: center;

            width: fit-content;

            padding: 7px 13px;

            border-radius: 999px;

            font-size: 13px;

            font-weight: 700;

        }


        .accident-status-badge.yes {

            border:
                1px solid rgba(32, 205, 176, .35);

            background:
                rgba(32, 205, 176, .10);

            color:
                #6fe7d1;

        }


        .accident-status-badge.no {

            border:
                1px solid rgba(255, 107, 107, .35);

            background:
                rgba(255, 107, 107, .10);

            color:
                #ff9999;

        }


        .accident-status-badge.unknown {

            border:
                1px solid rgba(255, 255, 255, .12);

            background:
                rgba(255, 255, 255, .06);

            color:
                #b8bec5;

        }



        /* =====================================================
           MAPA
           ===================================================== */

        .accident-detail-map-shell {

            width: 100%;

            overflow: hidden;

            margin-top: 16px;

            border:
                1px solid rgba(255, 255, 255, .10);

            border-radius: 14px;

            background:
                #111419;

        }


        #accidentDetailMap {

            width: 100%;

            height: 390px;

            min-height: 390px;

        }



        /* =====================================================
           COORDENADAS
           ===================================================== */

        .accident-coordinate-grid {

            display: grid;

            grid-template-columns:
                repeat(4,
                    minmax(0, 1fr));

            gap: 14px;

            margin-top: 18px;

        }


        .accident-coordinate-card {

            padding: 16px;

            border:
                1px solid rgba(255, 255, 255, .07);

            border-radius: 12px;

            background:
                #111419;

        }


        .accident-coordinate-card span {

            display: block;

            margin-bottom: 7px;

            color:
                #89919a;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .07em;

            text-transform: uppercase;

        }


        .accident-coordinate-card strong {

            color:
                #f4f5f7;

            font-size: 14px;

        }



        /* =====================================================
           FOTOGRAFÍAS
           ===================================================== */

        .accident-photo-folder-box {

            margin-top: 16px;

            padding: 20px;

            border:
                1px solid rgba(255, 255, 255, .08);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, .02);

        }


        .accident-photo-folder-box p {

            margin-top: 0;

            margin-bottom: 16px;

        }



        /* =====================================================
           ACCIONES
           ===================================================== */

        .accident-detail-actions {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;

        }


        .btn-disabled {

            opacity: .55;

            cursor: not-allowed;

            pointer-events: none;

        }



        /* =====================================================
           MODO CLARO
           ===================================================== */

        html[data-theme="light"] .accident-detail-map-shell,

        html[data-theme="light"] .accident-coordinate-card,

        html[data-theme="light"] .accident-photo-folder-box {

            border-color:
                #d8dfe2;

            background:
                #f7f9fa;

        }


        html[data-theme="light"] .accident-coordinate-card strong {

            color:
                #172027;

        }


        html[data-theme="light"] .accident-status-badge.unknown {

            border-color:
                #ccd4d8;

            background:
                #edf2f3;

            color:
                #53616a;

        }



        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 900px) {

            .accident-coordinate-grid {

                grid-template-columns:
                    repeat(2,
                        minmax(0, 1fr));

            }

        }


        @media (max-width: 600px) {

            .accident-coordinate-grid {

                grid-template-columns:
                    1fr;

            }


            #accidentDetailMap {

                height: 310px;

                min-height: 310px;

            }


            .accident-detail-actions {

                flex-direction:
                    column;

            }


            .accident-detail-actions .btn {

                width:
                    100%;

                text-align:
                    center;

            }

        }
    </style>

    <link rel="icon" type="image/png" href="img/asadalogo.png">
</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
         ===================================================== -->

    <header class="topbar">

        <button type="button" class="menu-btn" onclick="toggleMenu()" aria-label="Abrir menú de navegación">

            ☰

        </button>


        <div class="brand">

            <img src="img/asadalogo.png" alt="Logo ASADA Orosi" class="brand-logo">

            <span>
                ASADA OROSI
            </span>

        </div>

    </header>



    <!-- =====================================================
         MENÚ
         ===================================================== -->

     <aside
        id="sideMenu"
        class="side-menu">

        <a href="index.html">Inicio</a>

        <a href="registros.html">
            Listado de revisiones
        </a>

        <a href="mantenimiento.html">
            Crear nueva revisión
        </a>

        <a href="crear-accidente.html">
            Crear daño y accidente
        </a>

        <a href="accidentes.html">
            Listado de daños y accidentes
        </a>

        <a href="crear-factibilidad.html">
            Crear inspección de factibilidad
        </a>

        </a>

        <a href="excel.html">
            Descargar Excel
        </a>

    </aside>



    <!-- =====================================================
         DETALLE
         ===================================================== -->

    <main class="page detail-page">

        <div id="accidentDetail" aria-live="polite">

            <div class="empty-state">

                <p>
                    Cargando daño o accidente...
                </p>

            </div>

        </div>

    </main>



    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        window.ASADA_LEAFLET =
            window.L;

    </script>



    <!-- =====================================================
         APP.JS
         ===================================================== -->

    <script src="js/avisos.js?v=20260924-7"></script>
    <script src="js/app.js?v=20260924-7"></script>
    <script src="js/seguridad.js?v=20260924-7"></script>


    <!-- =====================================================
         DETALLE
         ===================================================== -->

    <script>

        (() => {


            const Leaflet =
                window.ASADA_LEAFLET;


            const $ =
                id =>
                    document.getElementById(
                        id
                    );


            let detailMap =
                null;



            /* =================================================
               TEXTO SEGURO
               ================================================= */

            function safeText(
                value
            ) {

                return String(
                    value ??
                    ""
                ).replace(
                    /[&<>"']/g,
                    character => ({

                        "&":
                            "&amp;",

                        "<":
                            "&lt;",

                        ">":
                            "&gt;",

                        '"':
                            "&quot;",

                        "'":
                            "&#039;"

                    })[
                        character
                    ]
                );

            }



            function safeMultiline(
                value
            ) {

                const text =
                    String(
                        value ??
                        ""
                    ).trim();


                if (
                    !text
                ) {

                    return "Sin información";

                }


                return safeText(
                    text
                ).replace(
                    /\r?\n/g,
                    "<br>"
                );

            }



            /* =================================================
               ESTADO
               ================================================= */

            function getStatusBadge(
                value
            ) {

                const normalized =
                    String(
                        value ||
                        ""
                    ).trim();


                if (
                    normalized === "Sí"
                ) {

                    return `

                        <span class="accident-status-badge yes">

                            Sí, puede continuar en uso

                        </span>

                    `;

                }


                if (
                    normalized === "No"
                ) {

                    return `

                        <span class="accident-status-badge no">

                            No, debe quedar fuera de uso

                        </span>

                    `;

                }


                return `

                    <span class="accident-status-badge unknown">

                        Sin información

                    </span>

                `;

            }



            /* =================================================
               FOTOGRAFÍAS

               AQUÍ ESTÁ EL CAMBIO QUE PEDISTE.

               No mostramos:
               - miniaturas
               - Fotografía 1
               - enlaces individuales

               Únicamente la carpeta.
               ================================================= */

            function renderAccidentPhotos(
                accident
            ) {

                if (
                    accident.carpetaFotosUrl
                ) {

                    return `

                        <div class="accident-photo-folder-box">

                            <p class="detail-text">

                                Las fotografías de este registro
                                están almacenadas en su carpeta
                                correspondiente.

                            </p>


                            <a
                                href="${safeText(
                        accident.carpetaFotosUrl
                    )}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn secondary">

                                Ver carpeta de fotografías

                            </a>

                        </div>

                    `;

                }


                return `

                    <div class="accident-photo-folder-box">

                        <p class="detail-text">

                            No se registraron fotografías
                            para este daño o accidente.

                        </p>

                    </div>

                `;

            }



            /* =================================================
               MAPA
               ================================================= */

            function renderAccidentDetailMap(
                latitude,
                longitude
            ) {

                const container =
                    $(
                        "accidentDetailMap"
                    );


                if (
                    !container
                ) {

                    return;

                }


                const lat =
                    Number(
                        latitude
                    );


                const lng =
                    Number(
                        longitude
                    );


                if (
                    !Number.isFinite(
                        lat
                    ) ||
                    !Number.isFinite(
                        lng
                    )
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <p>

                                No existen coordenadas válidas
                                para mostrar el mapa.

                            </p>

                        </div>

                    `;


                    return;

                }


                if (
                    !Leaflet ||
                    typeof Leaflet.map !==
                    "function"
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <p>
                                No fue posible cargar el mapa.
                            </p>

                        </div>

                    `;


                    return;

                }


                if (
                    detailMap
                ) {

                    try {

                        detailMap.remove();

                    } catch (
                    error
                    ) {

                        console.warn(
                            error
                        );

                    }

                }


                detailMap =
                    Leaflet.map(
                        container
                    )
                        .setView(
                            [
                                lat,
                                lng
                            ],
                            17
                        );


                Leaflet.tileLayer(

                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                    {

                        maxZoom:
                            19,

                        attribution:
                            '&copy; OpenStreetMap'

                    }

                ).addTo(
                    detailMap
                );


                /*
                    Punto vectorial.

                    No depende del PNG de Leaflet.
                */

                Leaflet.circleMarker(
                    [
                        lat,
                        lng
                    ],
                    {

                        radius:
                            9,

                        weight:
                            3,

                        color:
                            "#ffffff",

                        fillColor:
                            "#20cdb0",

                        fillOpacity:
                            1

                    }
                )
                    .addTo(
                        detailMap
                    )
                    .bindPopup(
                        "Ubicación registrada del daño o accidente"
                    );


                window.setTimeout(
                    () => {

                        if (
                            detailMap
                        ) {

                            detailMap.invalidateSize();

                        }

                    },
                    150
                );

            }



            /* =================================================
               TIMEOUT
               ================================================= */

            function withTimeout(
                promise,
                milliseconds
            ) {

                return Promise.race([

                    promise,

                    new Promise(
                        (
                            resolve,
                            reject
                        ) => {

                            window.setTimeout(
                                () => {

                                    reject(
                                        new Error(
                                            "La consulta tardó demasiado."
                                        )
                                    );

                                },
                                milliseconds
                            );

                        }
                    )

                ]);

            }



            /* =================================================
               CACHE
               ================================================= */

            function getCachedAccident(
                id
            ) {

                try {

                    const text =
                        sessionStorage.getItem(

                            "asada-accident-detail:" +

                            String(
                                id
                            )
                                .trim()
                                .toUpperCase()

                        );


                    return text

                        ? JSON.parse(
                            text
                        )

                        : null;


                } catch (
                error
                ) {

                    return null;

                }

            }



            function saveCachedAccident(
                accident
            ) {

                if (
                    !accident ||
                    !accident.id
                ) {

                    return;

                }


                try {

                    sessionStorage.setItem(

                        "asada-accident-detail:" +

                        String(
                            accident.id
                        )
                            .trim()
                            .toUpperCase(),

                        JSON.stringify(
                            accident
                        )

                    );


                } catch (
                error
                ) {

                    console.warn(
                        error
                    );

                }

            }



            /* =================================================
               ERROR
               ================================================= */

            function showError(
                message
            ) {

                const root =
                    $(
                        "accidentDetail"
                    );


                root.innerHTML = `

                    <div class="empty-state">

                        <h1>
                            No fue posible cargar el registro
                        </h1>

                        <p>

                            ${safeText(
                    message ||
                    "Se produjo un error."
                )}

                        </p>


                        <button
                            type="button"
                            class="btn primary"
                            onclick="window.retryAccidentDetail()">

                            Reintentar

                        </button>

                    </div>


                    <div class="nav-actions detail-bottom-navigation">

                        <a
                            href="accidentes.html"
                            class="btn-back">

                            Volver al listado

                        </a>

                    </div>

                `;

            }



            /* =================================================
               PINTAR DETALLE
               ================================================= */

            function directPdfDownloadUrl(value) {
                const raw = String(value || "").trim();

                if (!raw) {
                    return "";
                }

                const fileMatch = raw.match(
                    /drive\.google\.com\/file\/d\/([^/]+)/i
                );
                const queryMatch = raw.match(/[?&]id=([^&]+)/i);
                const fileId = fileMatch
                    ? fileMatch[1]
                    : queryMatch
                        ? queryMatch[1]
                        : "";

                return fileId
                    ? "https://drive.google.com/uc?export=download&id=" +
                        encodeURIComponent(fileId)
                    : raw;
            }

            async function downloadAccidentPdf(id, button) {
                if (!window.callApi) {
                    throw new Error("No se encontró la conexión con el sistema.");
                }

                const originalText = button
                    ? button.textContent
                    : "Descargar reporte";

                if (button) {
                    button.disabled = true;
                    button.textContent = "Preparando PDF...";
                }

                try {
                    const result = await window.callApi(
                        "getAccidentPdfData",
                        { id }
                    );
                    const base64 = String(result && result.data || "");

                    if (!base64) {
                        throw new Error("El reporte PDF no contiene datos descargables.");
                    }

                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);

                    for (let index = 0; index < binary.length; index++) {
                        bytes[index] = binary.charCodeAt(index);
                    }

                    const blob = new Blob([bytes], {
                        type: result.mimeType || "application/pdf"
                    });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = result.filename || (
                        "Reporte_Dano_Accidente_" + id + ".pdf"
                    );
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch (error) {
                    alert(
                        error && error.message
                            ? error.message
                            : "No fue posible descargar el PDF."
                    );
                } finally {
                    if (button) {
                        button.disabled = false;
                        button.textContent = originalText;
                    }
                }
            }

            function renderAccident(
                accident
            ) {

                const root =
                    $(
                        "accidentDetail"
                    );


                if (
                    !root ||
                    !accident
                ) {

                    return;

                }


                const backUrl =

                    accident.vehiculo

                        ? (

                            "accidentes.html?vehicle=" +

                            encodeURIComponent(
                                accident.vehiculo
                            )

                        )

                        : "accidentes.html";


                const editUrl =

                    "crear-accidente.html?id=" +

                    encodeURIComponent(
                        accident.id ||
                        ""
                    );

                const reportButton = `

                            <button
                                type="button"
                                class="btn primary"
                                data-download-accident-pdf
                                data-accident-id="${safeText(accident.id || "")}">

                                Descargar reporte

                            </button>

                        `;


                root.innerHTML = `


                    <div class="nav-actions">

                        <a
                            href="${backUrl}"
                            class="btn-back">

                            Volver a los reportes del vehículo

                        </a>

                    </div>



                    <div class="page-head detail-page-head">

                        <div>

                            <span class="eyebrow">
                                DAÑO / ACCIDENTE
                            </span>


                            <h1>

                                ${safeText(
                    accident.vehiculo ||
                    "Vehículo"
                )}

                            </h1>


                            <p>

                                Registro ${safeText(
                    accident.id ||
                    ""
                )}

                                · Placa ${safeText(
                    accident.placa ||
                    ""
                )}

                            </p>

                        </div>

                    </div>



                    <div class="detail-shell">


                        <!-- =====================================
                             INFORMACIÓN GENERAL
                             ===================================== -->

                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Información del registro
                                </h2>

                            </div>


                            <div class="vehicle-info-grid">


                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        ID del registro

                                    </span>

                                    <strong>

                                        ${safeText(
                    accident.id ||
                    "Sin información"
                )}

                                    </strong>

                                </div>



                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        Vehículo

                                    </span>

                                    <strong>

                                        ${safeText(
                    accident.vehiculo ||
                    "Sin información"
                )}

                                    </strong>

                                </div>



                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        Placa

                                    </span>

                                    <strong>

                                        ${safeText(
                    accident.placa ||
                    "Sin información"
                )}

                                    </strong>

                                </div>



                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        Fecha y hora

                                    </span>

                                    <strong>

                                        ${safeText(
                    accident.fechaHora ||
                    "Sin información"
                )}

                                    </strong>

                                </div>



                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        Chofer

                                    </span>

                                    <strong>

                                        ${safeText(
                    accident.chofer ||
                    "Sin información"
                )}

                                    </strong>

                                </div>



                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        ¿Puede continuar en uso?

                                    </span>

                                    ${getStatusBadge(
                    accident.puedeContinuarUso
                )}

                                </div>


                            </div>


                        </section>



                        <!-- =====================================
                             DAÑO
                             ===================================== -->

                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Información del daño o accidente
                                </h2>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Descripción de lo sucedido

                                </span>


                                <p class="detail-text">

                                    ${safeMultiline(
                    accident.descripcion
                )}

                                </p>

                            </div>



                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Ocupantes

                                </span>


                                <p class="detail-text">

                                    ${accident.ocupantes

                        ? safeMultiline(
                            accident.ocupantes
                        )

                        : "No se registraron acompañantes."
                    }

                                </p>

                            </div>



                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Persona a quien se reportó

                                </span>


                                <p class="detail-text">

                                    ${safeText(
                        accident.personaReportada ||
                        "Sin información"
                    )}

                                </p>

                            </div>


                        </section>



                        <!-- =====================================
                             UBICACIÓN
                             ===================================== -->

                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Ubicación geográfica
                                </h2>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Lugar, dirección o referencia

                                </span>


                                <p class="detail-text">

                                    ${safeText(
                        accident.ubicacion ||
                        "Sin información"
                    )}

                                </p>

                            </div>



                            <div class="accident-coordinate-grid">


                                <div class="accident-coordinate-card">

                                    <span>
                                        Coordenada Y - Latitud
                                    </span>

                                    <strong>

                                        ${safeText(
                        accident.latitud ||
                        "Sin información"
                    )}

                                    </strong>

                                </div>



                                <div class="accident-coordinate-card">

                                    <span>
                                        Coordenada X - Longitud
                                    </span>

                                    <strong>

                                        ${safeText(
                        accident.longitud ||
                        "Sin información"
                    )}

                                    </strong>

                                </div>



                                <div class="accident-coordinate-card">

                                    <span>
                                        Altitud (m)
                                    </span>

                                    <strong>

                                        ${safeText(
                        accident.altitud ||
                        "No disponible"
                    )}

                                    </strong>

                                </div>



                                <div class="accident-coordinate-card">

                                    <span>
                                        Precisión (m)
                                    </span>

                                    <strong>

                                        ${safeText(
                        accident.precision ||
                        "No disponible"
                    )}

                                    </strong>

                                </div>


                            </div>



                            <div class="accident-detail-map-shell">

                                <div id="accidentDetailMap">
                                </div>

                            </div>


                        </section>



                        <!-- =====================================
                             FOTOGRAFÍAS
                             ===================================== -->

                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Fotografías
                                </h2>

                            </div>


                            ${renderAccidentPhotos(
                        accident
                    )}


                        </section>



                        <!-- =====================================
                             REPORTE
                             ===================================== -->

                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Reporte y acciones
                                </h2>

                            </div>


                            <p class="detail-text">

                                ${accident.reportePdfUrl

                        ? "El reporte oficial PDF está disponible para descargar."

                        : "El reporte PDF todavía no está disponible."
                    }

                            </p>


                            <div class="accident-detail-actions">


                                <a
                                    href="${editUrl}"
                                    class="btn secondary">

                                    Editar registro

                                </a>


                                ${reportButton}


                            </div>


                        </section>


                    </div>



                    <div class="nav-actions detail-bottom-navigation">


                        <a
                            href="${backUrl}"
                            class="btn-back">

                            Volver

                        </a>


                        <a
                            href="accidentes.html"
                            class="btn-back">

                            Cambiar vehículo

                        </a>


                        <a
                            href="index.html"
                            class="btn-back">

                            Volver al inicio

                        </a>


                    </div>

                `;

                const reportDownloadButton = root.querySelector(
                    "[data-download-accident-pdf]"
                );

                if (reportDownloadButton) {
                    reportDownloadButton.addEventListener(
                        "click",
                        () => downloadAccidentPdf(
                            accident.id,
                            reportDownloadButton
                        )
                    );
                }


                window.setTimeout(
                    () => {

                        renderAccidentDetailMap(

                            accident.latitud,

                            accident.longitud

                        );

                    },
                    80
                );

            }



            /* =================================================
               CONSULTAR
               ================================================= */

            async function getFreshAccident(
                id
            ) {

                if (
                    typeof getAccidentByIdFromServer !==
                    "function"
                ) {

                    throw new Error(
                        "No se encontró la función para consultar el accidente."
                    );

                }


                return withTimeout(

                    getAccidentByIdFromServer(
                        id
                    ),

                    15000

                );

            }



            /* =================================================
               CARGAR DETALLE
               ================================================= */

            async function loadDetail() {

                const id =
                    new URLSearchParams(
                        window.location.search
                    )
                        .get(
                            "id"
                        );


                if (
                    !id
                ) {

                    showError(
                        "No se indicó el ID del registro."
                    );

                    return;

                }


                const normalizedId =
                    String(
                        id
                    )
                        .trim()
                        .toUpperCase();


                const cached =
                    getCachedAccident(
                        normalizedId
                    );


                /*
                    Si venimos del listado,
                    mostrar inmediatamente.
                */

                if (
                    cached &&
                    cached.id
                ) {

                    renderAccident(
                        cached
                    );


                    /*
                        Actualización silenciosa.
                    */

                    try {

                        const fresh =
                            await getFreshAccident(
                                normalizedId
                            );


                        if (
                            fresh &&
                            fresh.id
                        ) {

                            saveCachedAccident(
                                fresh
                            );


                            renderAccident(
                                fresh
                            );

                        }


                    } catch (
                    error
                    ) {

                        console.warn(
                            "No fue posible actualizar el detalle desde Google.",
                            error
                        );

                    }


                    return;

                }


                /*
                    Link abierto directamente.
                */

                try {

                    const accident =
                        await getFreshAccident(
                            normalizedId
                        );


                    if (
                        !accident ||
                        !accident.id
                    ) {

                        showError(
                            "El registro solicitado no existe."
                        );

                        return;

                    }


                    saveCachedAccident(
                        accident
                    );


                    renderAccident(
                        accident
                    );


                } catch (
                error
                ) {

                    console.error(
                        "Error al cargar accidente.",
                        error
                    );


                    showError(

                        error &&
                            error.message

                            ? error.message

                            : "No fue posible consultar Google."

                    );

                }

            }



            /* =================================================
               REINTENTAR
               ================================================= */

            window.retryAccidentDetail =
                function () {

                    const root =
                        $(
                            "accidentDetail"
                        );


                    if (
                        root
                    ) {

                        root.innerHTML = `

                            <div class="empty-state">

                                <p>
                                    Consultando registro...
                                </p>

                            </div>

                        `;

                    }


                    loadDetail();

                };



            document.addEventListener(
                "DOMContentLoaded",
                loadDetail
            );


        })();

    </script>

</body>

</html>
