<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#16181c">

    <meta
        name="description"
        content="Detalle del registro de daño o accidente de vehículos de ASADA Orosi.">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="css/style.css?v=20260911-23">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <title>
        Detalle de daño o accidente | ASADA Orosi
    </title>



    <style>

        /* =====================================================
           ESTADO
           ===================================================== */

        .accident-status-badge {

            display: inline-flex;

            align-items: center;

            width: fit-content;

            padding: 7px 13px;

            border-radius: 999px;

            font-size: 13px;

            font-weight: 700;

        }


        .accident-status-badge.yes {

            border:
                1px solid
                rgba(32, 205, 176, .35);

            background:
                rgba(32, 205, 176, .10);

            color:
                #6fe7d1;

        }


        .accident-status-badge.no {

            border:
                1px solid
                rgba(255, 107, 107, .35);

            background:
                rgba(255, 107, 107, .10);

            color:
                #ff9999;

        }


        .accident-status-badge.unknown {

            border:
                1px solid
                rgba(255, 255, 255, .12);

            background:
                rgba(255, 255, 255, .06);

            color:
                #b8bec5;

        }



        /* =====================================================
           MAPA
           ===================================================== */

        .accident-detail-map-shell {

            width: 100%;

            overflow: hidden;

            margin-top: 16px;

            border:
                1px solid
                rgba(255, 255, 255, .10);

            border-radius: 14px;

            background:
                #111419;

        }


        #accidentDetailMap {

            width: 100%;

            height: 390px;

            min-height: 390px;

        }



        /* =====================================================
           COORDENADAS
           ===================================================== */

        .accident-coordinate-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 14px;

            margin-top: 18px;

        }


        .accident-coordinate-card {

            padding: 16px;

            border:
                1px solid
                rgba(255, 255, 255, .07);

            border-radius: 12px;

            background:
                #111419;

        }


        .accident-coordinate-card span {

            display: block;

            margin-bottom: 7px;

            color:
                #89919a;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .07em;

            text-transform: uppercase;

        }


        .accident-coordinate-card strong {

            color:
                #f4f5f7;

            font-size: 14px;

        }



        /* =====================================================
           FOTOS
           ===================================================== */

        .accident-detail-photos {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        190px,
                        1fr
                    )
                );

            gap: 14px;

            margin-top: 18px;

        }


        .accident-detail-photo {

            display: block;

            overflow: hidden;

            border:
                1px solid
                rgba(255, 255, 255, .10);

            border-radius: 12px;

            background:
                #101214;

            text-decoration: none;

        }


        .accident-detail-photo img {

            display: block;

            width: 100%;

            height: 210px;

            object-fit: cover;

        }



        /* =====================================================
           ACCIONES
           ===================================================== */

        .accident-detail-actions {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;

        }


        .btn-disabled {

            opacity: .55;

            cursor: not-allowed;

            pointer-events: none;

        }



        /* =====================================================
           CARGA
           ===================================================== */

        .detail-loading {

            padding: 45px 20px;

            text-align: center;

        }


        .detail-loading strong {

            display: block;

            margin-bottom: 8px;

        }



        /* =====================================================
           MODO CLARO
           ===================================================== */

        html[data-theme="light"]
        .accident-detail-map-shell,

        html[data-theme="light"]
        .accident-coordinate-card,

        html[data-theme="light"]
        .accident-detail-photo {

            border-color:
                #d8dfe2;

            background:
                #f7f9fa;

        }


        html[data-theme="light"]
        .accident-coordinate-card strong {

            color:
                #172027;

        }


        html[data-theme="light"]
        .accident-status-badge.unknown {

            border-color:
                #ccd4d8;

            background:
                #edf2f3;

            color:
                #53616a;

        }



        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 900px) {

            .accident-coordinate-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );

            }

        }


        @media (max-width: 600px) {

            .accident-coordinate-grid {

                grid-template-columns:
                    1fr;

            }


            #accidentDetailMap {

                height: 310px;

                min-height: 310px;

            }


            .accident-detail-actions {

                flex-direction:
                    column;

            }


            .accident-detail-actions .btn {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
         ===================================================== -->

    <header class="topbar">

        <button
            type="button"
            class="menu-btn"
            onclick="toggleMenu()"
            aria-label="Abrir menú de navegación">

            ☰

        </button>


        <div class="brand">

            <img
                src="img/asadalogo.png"
                alt="Logo ASADA Orosi"
                class="brand-logo">

            <span>
                ASADA OROSI
            </span>

        </div>

    </header>



    <!-- =====================================================
         MENÚ
         ===================================================== -->

    <aside
        id="sideMenu"
        class="side-menu">

        <a href="index.html">
            Inicio
        </a>

        <a href="registros.html">
            Listado de revisiones
        </a>

        <a href="mantenimiento.html">
            Crear nueva revisión
        </a>

        <a
            id="menuCreateAccident"
            href="crear-accidente.html">

            Crear registro de daño y accidente

        </a>

        <a
            id="menuAccidentList"
            href="accidentes.html">

            Listado de daños y accidentes

        </a>

        <a href="excel.html">
            Descargar Excel
        </a>

    </aside>



    <!-- =====================================================
         DETALLE
         ===================================================== -->

    <main class="page detail-page">

        <div
            id="accidentDetail"
            aria-live="polite">

            <div class="detail-loading">

                <strong>
                    Cargando daño o accidente...
                </strong>

                <span>
                    Espere un momento.
                </span>

            </div>

        </div>

    </main>



    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        window.ASADA_LEAFLET =
            window.L;

    </script>



    <!-- =====================================================
         APP.JS
         ===================================================== -->

    <script src="js/app.js?v=20260911-23"></script>



    <!-- =====================================================
         DETALLE
         ===================================================== -->

    <script>

        (() => {


            const Leaflet =
                window.ASADA_LEAFLET;


            const $ =
                id =>
                    document.getElementById(
                        id
                    );


            let activeMap =
                null;



            /* =================================================
               TEXTO SEGURO
               ================================================= */

            function safeText(
                value
            ) {

                return String(
                    value ??
                    ""
                ).replace(
                    /[&<>"']/g,
                    character => ({

                        "&":
                            "&amp;",

                        "<":
                            "&lt;",

                        ">":
                            "&gt;",

                        '"':
                            "&quot;",

                        "'":
                            "&#039;"

                    })[
                        character
                    ]
                );

            }



            /* =================================================
               MULTILÍNEA
               ================================================= */

            function safeMultiline(
                value
            ) {

                const text =
                    String(
                        value ??
                        ""
                    ).trim();


                if (
                    !text
                ) {

                    return "Sin información";

                }


                return safeText(
                    text
                ).replace(
                    /\r?\n/g,
                    "<br>"
                );

            }



            /* =================================================
               TIMEOUT LOCAL
               ================================================= */

            function withTimeout(
                promise,
                milliseconds
            ) {

                return Promise.race([

                    promise,

                    new Promise(
                        (
                            resolve,
                            reject
                        ) => {

                            window.setTimeout(
                                () => {

                                    reject(
                                        new Error(
                                            "La consulta tardó demasiado."
                                        )
                                    );

                                },
                                milliseconds
                            );

                        }
                    )

                ]);

            }



            /* =================================================
               CACHE
               ================================================= */

            function cacheKey(
                id
            ) {

                return (

                    "asada-accident-detail:" +

                    String(
                        id ||
                        ""
                    )
                        .trim()
                        .toUpperCase()

                );

            }


            function getCachedAccident(
                id
            ) {

                try {

                    const stored =
                        sessionStorage.getItem(
                            cacheKey(
                                id
                            )
                        );


                    if (
                        !stored
                    ) {

                        return null;

                    }


                    return JSON.parse(
                        stored
                    );


                } catch (
                    error
                ) {

                    console.warn(
                        "No se pudo leer el accidente temporal.",
                        error
                    );


                    return null;

                }

            }


            function saveCachedAccident(
                accident
            ) {

                if (
                    !accident ||
                    !accident.id
                ) {

                    return;

                }


                try {

                    sessionStorage.setItem(

                        cacheKey(
                            accident.id
                        ),

                        JSON.stringify(
                            accident
                        )

                    );


                } catch (
                    error
                ) {

                    console.warn(
                        "No se pudo actualizar el accidente temporal.",
                        error
                    );

                }

            }



            /* =================================================
               ESTADO
               ================================================= */

            function getStatusBadge(
                value
            ) {

                const normalized =
                    String(
                        value ||
                        ""
                    ).trim();


                if (
                    normalized === "Sí"
                ) {

                    return `

                        <span class="accident-status-badge yes">

                            Sí, puede continuar en uso

                        </span>

                    `;

                }


                if (
                    normalized === "No"
                ) {

                    return `

                        <span class="accident-status-badge no">

                            No, debe quedar fuera de uso

                        </span>

                    `;

                }


                return `

                    <span class="accident-status-badge unknown">

                        Sin información

                    </span>

                `;

            }



            /* =================================================
               FOTOS
               ================================================= */

            function getPhotoSource(
                photo
            ) {

                if (
                    typeof getImageSource ===
                    "function"
                ) {

                    const source =
                        getImageSource(
                            photo
                        );


                    if (
                        source
                    ) {

                        return source;

                    }

                }


                if (
                    typeof photo ===
                    "string"
                ) {

                    return photo;

                }


                if (
                    !photo ||
                    typeof photo !== "object"
                ) {

                    return "";

                }


                return (

                    photo.thumbnailUrl ||

                    photo.url ||

                    photo.data ||

                    ""

                );

            }


            function getPhotoLink(
                photo
            ) {

                if (
                    typeof photo ===
                    "string"
                ) {

                    return photo;

                }


                if (
                    !photo ||
                    typeof photo !== "object"
                ) {

                    return "";

                }


                return (

                    photo.url ||

                    photo.thumbnailUrl ||

                    photo.data ||

                    ""

                );

            }


            function renderPhotos(
                accident
            ) {

                const photos =
                    Array.isArray(
                        accident.imagenes
                    )

                        ? accident.imagenes

                        : [];


                const usable =
                    photos.filter(
                        photo =>
                            Boolean(
                                getPhotoSource(
                                    photo
                                )
                            )
                    );


                if (
                    usable.length === 0
                ) {

                    if (
                        accident.carpetaFotosUrl
                    ) {

                        return `

                            <p class="detail-text">

                                Las fotografías están guardadas
                                en Drive.

                            </p>


                            <div class="photo-folder-action">

                                <a
                                    href="${safeText(
                                        accident.carpetaFotosUrl
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="btn secondary">

                                    Ver fotografías

                                </a>

                            </div>

                        `;

                    }


                    return `

                        <p class="detail-text">

                            No se registraron fotografías.

                        </p>

                    `;

                }


                return `

                    <div class="accident-detail-photos">

                        ${usable.map(
                            (
                                photo,
                                index
                            ) => {

                                const source =
                                    getPhotoSource(
                                        photo
                                    );


                                const link =
                                    getPhotoLink(
                                        photo
                                    ) ||
                                    source;


                                return `

                                    <a
                                        href="${safeText(
                                            link
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="accident-detail-photo">

                                        <img
                                            src="${safeText(
                                                source
                                            )}"
                                            alt="Fotografía ${index + 1}"
                                            loading="lazy">

                                    </a>

                                `;

                            }
                        ).join(
                            ""
                        )}

                    </div>


                    ${
                        accident.carpetaFotosUrl

                            ? `

                                <div class="photo-folder-action">

                                    <a
                                        href="${safeText(
                                            accident.carpetaFotosUrl
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="btn secondary">

                                        Abrir carpeta de fotografías

                                    </a>

                                </div>

                            `

                            : ""
                    }

                `;

            }



            /* =================================================
               MARCADOR
               ================================================= */

            function createMarkerIcon() {

                if (
                    !Leaflet ||
                    typeof Leaflet.icon !== "function"
                ) {

                    return null;

                }


                const svg = `

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="44"
                        height="58"
                        viewBox="0 0 48 62">

                        <path
                            d="
                                M24 2
                                C12.4 2 3 11.4 3 23
                                c0 16.5 21 36 21 36
                                s21-19.5 21-36
                                C45 11.4 35.6 2 24 2z
                            "
                            fill="#20cdb0"
                            stroke="#ffffff"
                            stroke-width="3"/>

                        <circle
                            cx="24"
                            cy="23"
                            r="8"
                            fill="#123d36"
                            stroke="#ffffff"
                            stroke-width="2"/>

                    </svg>

                `;


                return Leaflet.icon({

                    iconUrl:

                        "data:image/svg+xml;charset=UTF-8," +

                        encodeURIComponent(
                            svg
                        ),

                    iconSize:
                        [
                            44,
                            58
                        ],

                    iconAnchor:
                        [
                            22,
                            55
                        ],

                    popupAnchor:
                        [
                            0,
                            -50
                        ]

                });

            }



            /* =================================================
               MAPA
               ================================================= */

            function renderMap(
                latitude,
                longitude
            ) {

                const container =
                    $(
                        "accidentDetailMap"
                    );


                if (
                    !container
                ) {

                    return;

                }


                const lat =
                    Number(
                        latitude
                    );


                const lng =
                    Number(
                        longitude
                    );


                if (
                    !Number.isFinite(
                        lat
                    ) ||
                    !Number.isFinite(
                        lng
                    )
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <p>
                                No existen coordenadas válidas.
                            </p>

                        </div>

                    `;


                    return;

                }


                if (
                    !Leaflet ||
                    typeof Leaflet.map !== "function"
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <p>
                                No fue posible cargar el mapa.
                            </p>

                        </div>

                    `;


                    return;

                }


                if (
                    activeMap
                ) {

                    try {

                        activeMap.remove();

                    } catch (
                        error
                    ) {

                        console.warn(
                            error
                        );

                    }


                    activeMap =
                        null;

                }


                activeMap =
                    Leaflet.map(
                        container
                    )
                        .setView(
                            [
                                lat,
                                lng
                            ],
                            17
                        );


                Leaflet.tileLayer(

                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                    {

                        maxZoom:
                            19,

                        attribution:
                            '&copy; OpenStreetMap'

                    }

                ).addTo(
                    activeMap
                );


                const options =
                    {};


                const icon =
                    createMarkerIcon();


                if (
                    icon
                ) {

                    options.icon =
                        icon;

                }


                Leaflet.marker(
                    [
                        lat,
                        lng
                    ],
                    options
                )
                    .addTo(
                        activeMap
                    )
                    .bindPopup(
                        "Ubicación registrada del daño o accidente"
                    );


                window.setTimeout(
                    () => {

                        if (
                            activeMap
                        ) {

                            activeMap.invalidateSize();

                        }

                    },
                    150
                );

            }



            /* =================================================
               PINTAR DETALLE
               ================================================= */

            function renderAccident(
                accident
            ) {

                const root =
                    $(
                        "accidentDetail"
                    );


                if (
                    !root ||
                    !accident
                ) {

                    return;

                }


                const backUrl =

                    accident.vehiculo

                        ? (

                            "accidentes.html?vehicle=" +

                            encodeURIComponent(
                                accident.vehiculo
                            )

                        )

                        : "accidentes.html";


                const editUrl =

                    "crear-accidente.html?id=" +

                    encodeURIComponent(
                        accident.id ||
                        ""
                    );


                const reportButton =

                    accident.reportePdfUrl

                        ? `

                            <a
                                href="${safeText(
                                    accident.reportePdfUrl
                                )}"
                                class="btn primary">

                                Descargar reporte

                            </a>

                        `

                        : `

                            <span
                                class="btn secondary btn-disabled"
                                aria-disabled="true">

                                Reporte todavía no disponible

                            </span>

                        `;


                root.innerHTML = `


                    <div class="nav-actions">

                        <a
                            href="${backUrl}"
                            class="btn-back">

                            Volver a los reportes del vehículo

                        </a>

                    </div>



                    <div class="page-head detail-page-head">

                        <div>

                            <span class="eyebrow">
                                DAÑO / ACCIDENTE
                            </span>


                            <h1>

                                ${safeText(
                                    accident.vehiculo ||
                                    "Vehículo"
                                )}

                            </h1>


                            <p>

                                Registro ${safeText(
                                    accident.id ||
                                    ""
                                )}

                                · Placa ${safeText(
                                    accident.placa ||
                                    ""
                                )}

                            </p>

                        </div>

                    </div>



                    <div class="detail-shell">


                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Información del registro
                                </h2>

                            </div>


                            <div class="vehicle-info-grid">


                                <div class="detail-info">

                                    <span class="detail-info-label">
                                        ID del registro
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.id ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="detail-info">

                                    <span class="detail-info-label">
                                        Vehículo
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.vehiculo ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="detail-info">

                                    <span class="detail-info-label">
                                        Placa
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.placa ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="detail-info">

                                    <span class="detail-info-label">
                                        Fecha y hora
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.fechaHora ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="detail-info">

                                    <span class="detail-info-label">
                                        Chofer
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.chofer ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="detail-info">

                                    <span class="detail-info-label">

                                        ¿Puede continuar en uso?

                                    </span>

                                    ${getStatusBadge(
                                        accident.puedeContinuarUso
                                    )}

                                </div>


                            </div>


                        </section>



                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Información del daño o accidente
                                </h2>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">
                                    Descripción de lo sucedido
                                </span>

                                <p class="detail-text">

                                    ${safeMultiline(
                                        accident.descripcion
                                    )}

                                </p>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">
                                    Ocupantes
                                </span>

                                <p class="detail-text">

                                    ${
                                        accident.ocupantes

                                            ? safeMultiline(
                                                accident.ocupantes
                                            )

                                            : "No se registraron acompañantes."
                                    }

                                </p>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Persona a quien se reportó

                                </span>

                                <p class="detail-text">

                                    ${safeText(
                                        accident.personaReportada ||
                                        "Sin información"
                                    )}

                                </p>

                            </div>


                        </section>



                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Ubicación geográfica
                                </h2>

                            </div>


                            <div class="detail-group">

                                <span class="detail-info-label">

                                    Lugar, dirección o referencia

                                </span>

                                <p class="detail-text">

                                    ${safeText(
                                        accident.ubicacion ||
                                        "Sin información"
                                    )}

                                </p>

                            </div>



                            <div class="accident-coordinate-grid">


                                <div class="accident-coordinate-card">

                                    <span>
                                        Coordenada Y - Latitud
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.latitud ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="accident-coordinate-card">

                                    <span>
                                        Coordenada X - Longitud
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.longitud ||
                                            "Sin información"
                                        )}

                                    </strong>

                                </div>


                                <div class="accident-coordinate-card">

                                    <span>
                                        Altitud (m)
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.altitud ||
                                            "No disponible"
                                        )}

                                    </strong>

                                </div>


                                <div class="accident-coordinate-card">

                                    <span>
                                        Precisión (m)
                                    </span>

                                    <strong>

                                        ${safeText(
                                            accident.precision ||
                                            "No disponible"
                                        )}

                                    </strong>

                                </div>


                            </div>



                            <div class="accident-detail-map-shell">

                                <div id="accidentDetailMap">
                                </div>

                            </div>


                        </section>



                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Fotografías
                                </h2>

                            </div>


                            ${renderPhotos(
                                accident
                            )}


                        </section>



                        <section class="detail-card">


                            <div class="detail-card-header">

                                <h2>
                                    Reporte y acciones
                                </h2>

                            </div>


                            <p class="detail-text">

                                ${
                                    accident.reportePdfUrl

                                        ? "El reporte oficial PDF está disponible para descargar."

                                        : "El reporte PDF todavía no está disponible."
                                }

                            </p>


                            <div class="accident-detail-actions">


                                <a
                                    href="${editUrl}"
                                    class="btn secondary">

                                    Editar registro

                                </a>


                                ${reportButton}


                            </div>


                        </section>


                    </div>



                    <div class="nav-actions detail-bottom-navigation">


                        <a
                            href="${backUrl}"
                            class="btn-back">

                            Volver

                        </a>


                        <a
                            href="accidentes.html"
                            class="btn-back">

                            Cambiar vehículo

                        </a>


                        <a
                            href="index.html"
                            class="btn-back">

                            Volver al inicio

                        </a>


                    </div>

                `;


                window.setTimeout(
                    () => {

                        renderMap(

                            accident.latitud,

                            accident.longitud

                        );

                    },
                    80
                );

            }



            /* =================================================
               ERROR
               ================================================= */

            function showError(
                message
            ) {

                const root =
                    $(
                        "accidentDetail"
                    );


                if (
                    !root
                ) {

                    return;

                }


                root.innerHTML = `

                    <div class="empty-state">

                        <h1>
                            No fue posible cargar el registro
                        </h1>

                        <p>
                            ${safeText(
                                message ||
                                "Se produjo un error al consultar el registro."
                            )}
                        </p>

                        <button
                            type="button"
                            class="btn primary"
                            onclick="window.retryAccidentDetail()">

                            Reintentar

                        </button>

                    </div>


                    <div class="nav-actions detail-bottom-navigation">

                        <a
                            href="accidentes.html"
                            class="btn-back">

                            Volver al listado

                        </a>

                    </div>

                `;

            }



            /* =================================================
               CONSULTA AL SERVIDOR
               ================================================= */

            async function getFreshAccident(
                id
            ) {

                if (
                    typeof getAccidentByIdFromServer !==
                    "function"
                ) {

                    throw new Error(
                        "No se encontró la función para consultar el accidente."
                    );

                }


                return withTimeout(

                    getAccidentByIdFromServer(
                        id
                    ),

                    15000

                );

            }



            /* =================================================
               INICIAR
               ================================================= */

            async function loadDetail() {

                const id =
                    new URLSearchParams(
                        window.location.search
                    )
                        .get(
                            "id"
                        );


                if (
                    !id
                ) {

                    showError(
                        "No se indicó el ID del registro."
                    );

                    return;

                }


                const normalizedId =
                    String(
                        id
                    )
                        .trim()
                        .toUpperCase();


                const cached =
                    getCachedAccident(
                        normalizedId
                    );


                /*
                    SI VIENE DEL LISTADO:

                    Mostramos inmediatamente.
                */

                if (
                    cached &&
                    cached.id
                ) {

                    renderAccident(
                        cached
                    );


                    /*
                        Luego consultamos Google en segundo plano.

                        Si Google tarda o falla, el usuario ya puede
                        ver el registro.
                    */

                    try {

                        const fresh =
                            await getFreshAccident(
                                normalizedId
                            );


                        if (
                            fresh &&
                            fresh.id
                        ) {

                            saveCachedAccident(
                                fresh
                            );


                            renderAccident(
                                fresh
                            );

                        }


                    } catch (
                        error
                    ) {

                        console.warn(
                            "El detalle se mostró desde memoria, pero Google no respondió a tiempo.",
                            error
                        );

                    }


                    return;

                }


                /*
                    SI ABRIÓ EL LINK DIRECTAMENTE:

                    Consultamos Google.
                */

                try {

                    const accident =
                        await getFreshAccident(
                            normalizedId
                        );


                    if (
                        !accident ||
                        !accident.id
                    ) {

                        showError(
                            "El registro solicitado no existe."
                        );

                        return;

                    }


                    saveCachedAccident(
                        accident
                    );


                    renderAccident(
                        accident
                    );


                } catch (
                    error
                ) {

                    console.error(
                        "Error al cargar accidente.",
                        error
                    );


                    showError(

                        error &&
                        error.message

                            ? error.message

                            : "No fue posible consultar Google."

                    );

                }

            }



            /* =================================================
               REINTENTAR
               ================================================= */

            window.retryAccidentDetail =
                function () {

                    const root =
                        $(
                            "accidentDetail"
                        );


                    if (
                        root
                    ) {

                        root.innerHTML = `

                            <div class="detail-loading">

                                <strong>
                                    Consultando registro...
                                </strong>

                                <span>
                                    Espere un momento.
                                </span>

                            </div>

                        `;

                    }


                    loadDetail();

                };



            document.addEventListener(
                "DOMContentLoaded",
                loadDetail
            );


        })();

    </script>


</body>

</html>
