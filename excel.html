<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#16181c">

    <meta
        name="description"
        content="Descarga de registros de revisiones de vehículos de ASADA Orosi.">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="css/style.css">

    <title>
        Descargar Excel | ASADA Orosi
    </title>


    <!--
        Librería para crear archivos Excel
    -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js">
    </script>

</head>

<body>

    <header class="topbar">

        <button
            type="button"
            class="menu-btn"
            onclick="toggleMenu()"
            aria-label="Abrir menú de navegación">
            ☰
        </button>


        <div class="brand">

            <img
                src="img/asadalogo.png"
                alt="Logo ASADA Orosi"
                class="brand-logo">

            <span>
                ASADA OROSI
            </span>

        </div>

    </header>


    <aside
        id="sideMenu"
        class="side-menu">

        <a href="index.html">
            Inicio
        </a>

        <a href="registros.html">
            Registro de revisiones
        </a>

        <a href="mantenimiento.html">
            Crear registro de revisión
        </a>

        <a href="excel.html">
            Descargar Excel
        </a>

    </aside>


    <main class="page">

        <div class="nav-actions">

            <a
                href="index.html"
                class="btn-back">
                Volver al inicio
            </a>

        </div>


        <div class="page-head">

            <div>

                <span class="eyebrow">
                    EXPORTACIÓN
                </span>

                <h1>
                    Descargar Excel
                </h1>

                <p>
                    Seleccione los registros que desea incluir en el archivo.
                </p>

            </div>

        </div>


        <section class="export-card">

            <label for="exportScope">

                Registros a descargar

                <select
                    id="exportScope"
                    onchange="toggleVehicleExport()">

                    <option value="all">
                        Todos los registros
                    </option>

                    <option value="vehicle">
                        Registros de un vehículo específico
                    </option>

                </select>

            </label>


            <div
                id="exportVehicleWrap"
                class="export-vehicle-wrap hidden">

                <label for="exportVehicle">

                    Vehículo

                    <select id="exportVehicle">

                        <option value="">
                            Seleccione un vehículo
                        </option>

                        <option value="Toyota Rush">
                            Toyota Rush - BPW199
                        </option>

                        <option value="Isuzu D-Max Gris">
                            Isuzu D-Max Gris - CL376760
                        </option>

                        <option value="Isuzu D-Max Blanco">
                            Isuzu D-Max Blanco - AGV
                        </option>

                    </select>

                </label>

            </div>


            <div class="export-description">

                <p id="exportDescription">
                    El archivo incluirá todos los registros de revisión existentes.
                </p>

            </div>


            <button
                id="downloadExcelButton"
                type="button"
                class="btn primary"
                onclick="exportExcel()">

                Descargar archivo

            </button>


            <p
                id="excelStatus"
                aria-live="polite">
            </p>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
